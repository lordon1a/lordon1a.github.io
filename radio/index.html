<!doctype html>
<html lang="tr" data-phase="aksam">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunshine Radio</title>
  <meta name="description" content="Birlikte dinlenen YouTube radyosu: güneşli bir odada dönen bir plak, sohbet ve şarkı önerileri.">
  <meta name="theme-color" content="#1d1016">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500;1,9..144,700&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main id="stage" class="stage">
    <header class="top">
      <div class="brand">
        <span id="brandMark" class="brand-mark" aria-hidden="true">☀</span>
        <div>
          <h1 id="brand">Sunshine Radio</h1>
          <p class="sub"><span id="live" class="live">sessiz</span><span class="dot">·</span><span id="listeners">0 dinleyici</span></p>
        </div>
      </div>
      <button id="phaseBtn" class="chip" type="button">vakit</button>
    </header>

    <p id="hint" class="hint">plağa dokun · canlı yayına dön</p>
    <div id="fx" class="fx" aria-hidden="true"></div>

    <section class="deck glass" aria-label="şu an çalıyor">
      <div class="now">
        <span class="eyebrow">şu an çalıyor</span>
        <a id="title" class="title" target="_blank" rel="noopener">—</a>
        <span class="meta">öneren <b id="by">—</b></span>
        <span id="nowNote" class="dedication" hidden></span>
      </div>
      <div class="controls">
        <div class="votes">
          <button id="up" class="vote" type="button" title="beğen">▲ <span>0</span></button>
          <button id="down" class="vote" type="button" title="beğenme">▼ <span>0</span></button>
        </div>
        <button id="share" class="chip" type="button">𝕏 paylaş</button>
        <label class="vol">
          <span class="eyebrow">ses</span>
          <input id="vol" type="range" min="0" max="100">
          <b id="volv"></b>
        </label>
      </div>
    </section>
  </main>

  <aside id="chat" class="chat glass">
    <header class="chat-head">
      <b class="chat-title">Sohbet</b>
      <span id="chatCount" class="muted"></span>
      <button id="chatClose" class="icon" type="button" aria-label="sohbeti kapat">✕</button>
    </header>

    <figure class="monitor">
      <div class="video-wrap">
        <div id="yt"></div>
        <div id="empty" class="video-empty">Kuyruk boş.<br>Sağdaki “sıradaki” kısmından şarkı ekle.</div>
      </div>
      <figcaption>kaynak: youtube · izlenme sanatçıya sayılır</figcaption>
    </figure>

    <div class="queue-bar">
      <button id="queueToggle" class="queue-next" type="button"><span class="eyebrow">sıradaki</span> <b id="nextTitle">—</b> <span class="caret">▾</span></button>
      <button id="skip" class="skip" type="button">geç 0/1</button>
    </div>
    <div id="queue" class="queue" hidden>
      <form id="addForm" class="row-form">
        <input id="addInput" placeholder="youtube linki yapıştır…" autocomplete="off">
        <button type="submit">ekle</button>
        <input id="addNote" maxlength="80" placeholder="not ekle (isteğe bağlı) · ör. Yiğit'e gelsin 🎧" autocomplete="off">
      </form>
      <ol id="queueList" class="queue-list"></ol>
    </div>

    <ol id="messages" class="messages"></ol>

    <footer class="chat-foot">
      <div class="me">
        <span id="meAvatar" class="avatar"></span>
        <b id="meName"></b>
        <button id="editMe" class="link" type="button">değiştir</button>
        <div id="reacts" class="reacts"></div>
      </div>
      <form id="chatForm" class="row-form">
        <input id="chatInput" maxlength="300" placeholder="bir şey yaz…" autocomplete="off">
        <button type="submit">yolla</button>
      </form>
    </footer>
  </aside>
  <button id="chatOpen" class="chat-open" type="button" hidden>💬 sohbet</button>

  <dialog id="joinDlg" class="join glass">
    <form method="dialog" id="joinForm">
      <span class="brand-mark big-mark" aria-hidden="true">☀</span>
      <h2>Sunshine Radio'ya hoş geldin</h2>
      <p class="muted">Plak dönüyor. Adını yaz, bir avatar seç, gel otur.</p>
      <label class="eyebrow" for="joinName">takma adın</label>
      <input id="joinName" maxlength="20" required placeholder="ör. Yiğit" autocomplete="off">
      <span class="eyebrow">avatarın</span>
      <div id="avatarPick" class="avatar-pick"></div>
      <button type="submit" class="big">içeri gir ▶</button>
      <p id="demoNote" class="fine" hidden>Demo modu: Firebase ayarlanmadı, şu an sadece sen görüyorsun.</p>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="app.js"></script>
  <script type="module" src="scene.js"></script>
</body>
</html>
