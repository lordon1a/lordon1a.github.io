<!doctype html>
<html lang="tr" data-phase="aksam">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Güldal · Linkler</title>
  <meta name="description" content="Sunshine Radio ve tüm linklerim tek sayfada.">
  <meta name="theme-color" content="#3b2150">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800;9..144,900&family=DM+Sans:opsz,wght@9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="wrap">
    <header class="hero">
      <figure class="polaroid">
        <span class="tape" aria-hidden="true"></span>
        <div class="photo" id="avatar">
          <!-- varsayılan avatar: gözlüklü güneş -->
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <radialGradient id="sunG" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#fff3b8"/><stop offset=".55" stop-color="#f7c236"/><stop offset="1" stop-color="#e8871c"/></radialGradient>
              <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6b5"/><stop offset="1" stop-color="#ffc98a"/></linearGradient>
            </defs>
            <rect width="120" height="120" fill="url(#skyG)"/>
            <g stroke="#2b2118" stroke-width="3" stroke-linecap="round">
              <path d="M60 8 v14 M60 98 v14 M8 60 h14 M98 60 h14 M23 23 l10 10 M87 87 l10 10 M97 23 l-10 10 M33 87 l-10 10"/>
            </g>
            <circle cx="60" cy="60" r="32" fill="url(#sunG)" stroke="#2b2118" stroke-width="3"/>
            <path d="M34 54 h52" stroke="#2b2118" stroke-width="3"/>
            <rect x="37" y="52" width="19" height="12" rx="5" fill="#2b2118"/>
            <rect x="64" y="52" width="19" height="12" rx="5" fill="#2b2118"/>
            <path d="M48 74 q12 9 24 0" fill="none" stroke="#2b2118" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
      </figure>
      <p class="eyebrow"><span class="bar"></span><span id="eyebrow"></span></p>
      <h1 id="name"></h1>
      <p class="tagline" id="tagline"></p>
    </header>

    <nav class="links" id="links" aria-label="linkler"></nav>

    <footer class="foot">
      <button id="phaseBtn" class="chip" type="button">vakit</button>
      <span id="clock"></span>
    </footer>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="main.js"></script>
  <script type="module" src="scene.js"></script>
</body>
</html>
